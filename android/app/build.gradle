apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

import groovy.json.JsonSlurper

// App version comes from package.json ("version" + "buildVersion")
def nodePackageJson = new JsonSlurper().parseText(new File("$rootDir/../package.json").text)
def nodePackageVersion = nodePackageJson["version"]
def nodeBuildVersion = nodePackageJson["buildVersion"]

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "net.b3da.nnn"
    defaultConfig {
        applicationId "net.b3da.nnn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode nodeBuildVersion
        versionName nodePackageVersion
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('NNN_UPLOAD_STORE_FILE')) {
                storeFile file(NNN_UPLOAD_STORE_FILE)
                storePassword NNN_UPLOAD_STORE_PASSWORD
                keyAlias NNN_UPLOAD_KEY_ALIAS
                keyPassword NNN_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Animated GIF / WebP support in posts.
    // Version must match RN's fresco (node_modules/react-native/gradle/libs.versions.toml).
    def frescoVersion = "3.6.0"
    implementation("com.facebook.fresco:animated-gif:${frescoVersion}")
    implementation("com.facebook.fresco:animated-webp:${frescoVersion}")
    implementation("com.facebook.fresco:webpsupport:${frescoVersion}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
